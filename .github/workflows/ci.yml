name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install CPU-only PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.1"
      - name: Install PhotonAct and development tools
        run: python -m pip install -e ".[dev,data]"
      - name: Check formatting and lint
        run: ruff check .
      - name: Check types
        run: mypy photonact
      - name: Validate citation metadata
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install cffconvert
          cffconvert --validate -i CITATION.cff
      - name: Run tests
        run: pytest
      - name: Run minimal backward example
        run: python examples/minimal.py
      - name: Run explicit-state hysteresis example
        run: python examples/hysteresis.py
      - name: Run reproducible hardware-effect example
        run: python examples/hardware_effects.py
      - name: Inspect bundled curve
        run: photonact inspect examples/curves/sample_phh.csv
      - name: Generate local interactive demo
        run: photonact demo sample_phh --output /tmp/photonact-demo.html --no-open
      - name: Build wheel
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Verify installed wheel and bundled curve
        if: matrix.python-version == '3.12'
        run: |
          python -m venv --system-site-packages /tmp/photonact-wheel-smoke
          /tmp/photonact-wheel-smoke/bin/python -m pip install --no-deps --force-reinstall dist/*.whl
          cd /tmp
          /tmp/photonact-wheel-smoke/bin/python -m photonact inspect sample_phh
          /tmp/photonact-wheel-smoke/bin/python -m photonact demo sample_phh --output /tmp/installed-demo.html --no-open
          printf 'input_power,output_power\n0,0\n1,1\n' > /tmp/installed-curve.csv
          /tmp/photonact-wheel-smoke/bin/python -m photonact prepare /tmp/installed-curve.csv --output-dir /tmp/installed-curve --name smoke --input-column input_power --output-column output_power --input-unit normalized_power --output-unit normalized_power --source-description "Synthetic installation test" --data-kind synthetic --license CC0-1.0
          /tmp/photonact-wheel-smoke/bin/python -c "import torch; from photonact import CurveActivation, HardwareAwareActivation, HardwareEffects; from photonact.cli.main import resolve_curve_path; x = torch.tensor([0.5]); layer = HardwareAwareActivation(CurveActivation.from_file(resolve_curve_path('sample_phh'), branch='up'), HardwareEffects(quantization_step=0.1)); assert layer(x).shape == x.shape"
