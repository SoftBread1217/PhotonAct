[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "photonact"
version = "0.1.1.dev0"
description = "Turn optical device response curves into differentiable PyTorch activations."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [{ name = "Boyang Duan", email = "duanboyang@bupt.edu.cn" }]
keywords = ["photonics", "pytorch", "hardware-aware-ml", "nonlinear-optics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "torch>=2.1",
]

[project.urls]
Homepage = "https://github.com/SoftBread1217/PhotonAct"
Repository = "https://github.com/SoftBread1217/PhotonAct"
Issues = "https://github.com/SoftBread1217/PhotonAct/issues"
Changelog = "https://github.com/SoftBread1217/PhotonAct/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["mypy>=1.10,<2", "pytest>=8,<9", "ruff>=0.12,<0.13"]
data = ["openpyxl>=3.1,<4"]
notebook = ["jupyterlab>=4", "matplotlib>=3.7"]

[project.scripts]
photonact = "photonact.cli:main"

[tool.setuptools.packages.find]
include = ["photonact*"]

[tool.setuptools.package-data]
photonact = ["data/*.csv", "data/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
packages = ["photonact"]
